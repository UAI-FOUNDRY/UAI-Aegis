# Judge0 settings for UAI Aegis.
# Based on Judge0 1.13.1's judge0.conf; compare with the official file when upgrading.
# CHANGE EVERY PASSWORD AND TOKEN BELOW before any shared or production use, and put
# the same token in AEGIS_JUDGE0_TOKEN.

# Storage used by Judge0 itself
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=change-me-judge0-redis
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-judge0-db

# Only the Aegis API may submit code
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-me-judge0-token

# Student code never gets network access
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Aegis submits tests in batches of up to 20
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20

# Limits (Aegis sends per-question limits within these maximums)
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024
