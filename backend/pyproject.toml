[project]
name = "uai-aegis-backend"
version = "0.10.3"
description = "UAI Aegis: proctored practical exams for Universal AI University"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
# If a test hangs, print where every thread is stuck after 2 minutes (the run continues).
faulthandler_timeout = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Same rules as CI, so `ruff check .` locally catches what CI would.
select = ["F", "E9", "B", "UP", "SIM", "I"]
ignore = ["B008", "UP017", "SIM108", "B904", "UP040", "SIM102"]
