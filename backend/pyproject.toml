[project]
name = "uai-aegis-backend"
version = "0.1.0"
description = "UAI Aegis: proctored practical exams for Universal AI University"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
