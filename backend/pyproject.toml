[project]
name = "uai-aegis-backend"
version = "0.1.0"
description = "UAI Aegis: proctored practical exams for Universal AI University"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # uvicorn 0.34 still uses the websockets "legacy" server API; harmless
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
