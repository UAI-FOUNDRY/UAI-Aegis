name: desktop

# The student app, built on all three systems so the platform-only lockdown code
# (Windows exam desktop + keyboard hook, macOS kiosk + key filter, Linux exam session)
# is compiled and tested on every change, not only on someone's laptop.
on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: No known high-severity vulnerabilities in shipped JavaScript
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high
      - name: Type check and build the UI (the Rust build embeds dist/)
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Rust tests (signing, encrypted drafts, macOS key rules, Linux session checks)
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: Release build compiles (release-only checks included)
        working-directory: desktop/src-tauri
        run: cargo check --release --lib
